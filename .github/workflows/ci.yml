name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validate-fullstack-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate fullstack template
        run: npm run check

      - name: Validate vendored skills
        run: |
          test -f apps/mobile/skills/expo/building-native-ui/SKILL.md
          test -f apps/api/skills/nestjs/agent-nestjs-skills/SKILL.md

