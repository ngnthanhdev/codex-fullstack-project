name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validate-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate task scripts
        run: |
          node scripts/pick-task.js --check
          node scripts/add-task.js --file /tmp/codex-template-task.md "CI smoke task"

      - name: Validate Expo skills are present
        run: |
          test -f skills/expo/building-native-ui/SKILL.md
          test -f skills/expo/native-data-fetching/SKILL.md
          test -f skills/expo/expo-deployment/SKILL.md
          test -f skills/expo/LICENSE

      - name: List skill count
        run: find skills/expo -name SKILL.md | wc -l
